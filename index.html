<section class="confirmacao">
    <h2>Confirme sua presença</h2>

    <input 
        type="text" 
        id="nome" 
        placeholder="Digite seu nome"
        autocomplete="name"
    >

    <p>Você vai participar?</p>

    <div class="botoes-confirmacao">
        <button type="button" onclick="confirmarPresenca('Vou')">
            Vou
        </button>

        <button type="button" onclick="confirmarPresenca('Não vou')">
            Não vou
        </button>
    </div>

    <p id="resultado"></p>
</section>
